[package]
name = "swap-to-strk"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
dotenvy = "0.15.7"
futures = "0.3.34"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
starknet-rust = "0.19.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
